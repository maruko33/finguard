name: Rollback Dev

on:
  workflow_dispatch:
    inputs:
      task_revision:
        description: "Task definition revision to roll back to"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ca-central-1

  ECS_CLUSTER: finguard-cluster
  ECS_SERVICE: finguard-transaction-api
  ECS_TASK_DEFINITION_FAMILY: finguard-transaction-api

  ALB_NAME: finguard-alb

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show current deployment
        run: |
          CURRENT_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          echo "Current task definition:"
          echo "$CURRENT_TASK_DEFINITION"

      - name: Validate rollback target
        env:
          TARGET_REVISION: ${{ inputs.task_revision }}
        run: |
          TARGET_TASK_DEFINITION="$ECS_TASK_DEFINITION_FAMILY:$TARGET_REVISION"

          echo "Rollback target:"
          echo "$TARGET_TASK_DEFINITION"

          aws ecs describe-task-definition \
            --task-definition "$TARGET_TASK_DEFINITION" \
            > /dev/null

      - name: Roll back ECS service
        env:
          TARGET_REVISION: ${{ inputs.task_revision }}
        run: |
          TARGET_TASK_DEFINITION="$ECS_TASK_DEFINITION_FAMILY:$TARGET_REVISION"

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TARGET_TASK_DEFINITION" \
            > /dev/null

          echo "Rollback started:"
          echo "$TARGET_TASK_DEFINITION"

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Smoke test rolled back deployment
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --region "$AWS_REGION" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          echo "Testing http://$ALB_DNS/api/v1/health"

          for i in {1..30}; do
            if curl -fsS "http://$ALB_DNS/api/v1/health"; then
              echo
              echo "Rollback smoke test passed"
              exit 0
            fi

            echo "Health check attempt $i failed"
            sleep 10
          done

          echo "Rollback smoke test failed"
          exit 1