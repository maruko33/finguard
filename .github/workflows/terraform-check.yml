name: Terraform Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - "infra/bootstrap/**"
      - ".github/workflows/terraform-check.yml"

  push:
    branches:
      - main
    paths:
      - "infra/terraform/**"
      - "infra/bootstrap/**"
      - ".github/workflows/terraform-check.yml"

permissions:
  contents: read

jobs:
  terraform-static:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - infra/terraform
          - infra/bootstrap

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform
        run: terraform validate -no-color

  terraform-plan:
    needs: terraform-static
    # PRs run static checks only; AWS access is limited to protected main pushes.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      needs.terraform-static.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ca-central-1
      TF_IN_AUTOMATION: "true"
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.3"

      - name: Authenticate Terraform Plan role with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Initialize runtime remote backend
        run: |
          : "${TF_STATE_BUCKET:?Set the TF_STATE_BUCKET repository variable}"
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=finguard/dev/terraform.tfstate" \
            -backend-config="region=ca-central-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Plan runtime infrastructure
        run: terraform plan -input=false -no-color -lock-timeout=60s
