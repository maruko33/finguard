name: Deploy Dev

on:
  push:
    branches:
      - main
    paths:
      - "services/transaction-api/**"
      - ".github/workflows/deploy-dev.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: finguard-transaction-api

jobs:
  publish-transaction-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Package Transaction API
        working-directory: services/transaction-api
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Transaction API image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            services/transaction-api

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Published:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"