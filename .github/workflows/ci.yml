name: FinGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transaction-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_URL: jdbc:postgresql://localhost:5432/finguard
      DB_USERNAME: finguard
      DB_PASSWORD: finguard_test
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
      SQS_QUEUE_URL: https://sqs.ca-central-1.amazonaws.com/000000000000/finguard-test
      API_CONTAINER: finguard-api-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: finguard
          POSTGRES_USER: finguard
          POSTGRES_PASSWORD: finguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finguard -d finguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Test and package Transaction API
        working-directory: services/transaction-api
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Build Transaction API Docker image
        working-directory: services/transaction-api
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker build -t "finguard-transaction-api:$IMAGE_TAG" .

      - name: Start Transaction API container
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker run -d \
            --name "$API_CONTAINER" \
            --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:8080:8080 \
            -e DB_URL=jdbc:postgresql://host.docker.internal:5432/finguard \
            -e DB_USERNAME -e DB_PASSWORD \
            -e AWS_REGION -e AWS_DEFAULT_REGION \
            -e AWS_ACCESS_KEY_ID -e AWS_SECRET_ACCESS_KEY \
            -e AWS_EC2_METADATA_DISABLED -e SQS_QUEUE_URL \
            "finguard-transaction-api:$IMAGE_TAG"

      - name: Smoke test Transaction API
        run: |
          for i in {1..30}; do
            if curl -fsS --connect-timeout 2 --max-time 5 http://localhost:8080/api/v1/health; then
              echo "Transaction API is healthy"
              exit 0
            fi
            echo "Waiting for Transaction API (attempt $i/30)"
            sleep 2
          done
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: docker logs "$API_CONTAINER"

      - name: Clean up Transaction API container
        if: always()
        run: docker rm -f "$API_CONTAINER" || true

  risk-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/risk-worker
        run: python -m pip install -r requirements.txt

      - name: Run Risk Worker tests
        working-directory: services/risk-worker
        env:
          PYTHONPATH: src
        run: python -m pytest

  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: finguard-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CI_IMAGE_TAG: ${{ github.sha }}
      # Needed while interpolating the base file, before override merging.
      POSTGRES_PASSWORD: finguard_test
      SQS_QUEUE_URL: https://sqs.ca-central-1.amazonaws.com/000000000000/finguard-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Package Transaction API for this job
        working-directory: services/transaction-api
        run: ./mvnw --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Start isolated FinGuard integration environment
        run: |
          docker compose --env-file /dev/null --project-name "$COMPOSE_PROJECT_NAME" \
            -f compose.yaml -f compose.ci.yaml \
            up -d --build postgres transaction-api

      - name: Smoke test Compose Transaction API
        run: |
          for i in {1..30}; do
            if curl -fsS --connect-timeout 2 --max-time 5 http://localhost:8080/api/v1/health; then
              echo "Compose Transaction API is healthy"
              exit 0
            fi
            echo "Waiting for Compose Transaction API (attempt $i/30)"
            sleep 2
          done
          exit 1

      - name: Show Compose logs on failure
        if: failure()
        run: |
          docker compose --env-file /dev/null --project-name "$COMPOSE_PROJECT_NAME" \
            -f compose.yaml -f compose.ci.yaml logs --no-color --tail=100 postgres transaction-api

      - name: Clean up isolated integration environment
        if: always()
        run: |
          docker compose --env-file /dev/null --project-name "$COMPOSE_PROJECT_NAME" \
            -f compose.yaml -f compose.ci.yaml down --volumes --remove-orphans
