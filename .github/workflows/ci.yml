name: FinGuard CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  transaction-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17


        env:
          POSTGRES_DB: finguard
          POSTGRES_USER: finguard
          POSTGRES_PASSWORD: finguard_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U finguard -d finguard"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Transaction API test
        working-directory: services/transaction-api
        env:
          DB_URL: jdbc:postgresql://localhost:5432/finguard
          DB_USERNAME: finguard
          DB_PASSWORD: finguard_test

          AWS_REGION: ca-central-1
          AWS_DEFAULT_REGION: ca-central-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_EC2_METADATA_DISABLED: "true"

          SQS_QUEUE_URL: https://sqs.ca-central-1.amazonaws.com/000000000000/finguard-test  
                  
        run: ./mvnw clean test