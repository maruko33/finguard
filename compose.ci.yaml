# CI-only override. Use --env-file /dev/null and a unique --project-name.
# Base-file interpolation still needs synthetic POSTGRES_PASSWORD/SQS_QUEUE_URL.
services:
  transaction-api:
    image: finguard-transaction-api:${CI_IMAGE_TAG:?Set CI_IMAGE_TAG for CI}
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finguard
      DB_USERNAME: finguard
      DB_PASSWORD: finguard_test
      AWS_PROFILE: !reset null
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
      SQS_QUEUE_URL: https://sqs.ca-central-1.amazonaws.com/000000000000/finguard-test
    volumes: !reset []

  postgres:
    ports: !reset []
    volumes: !reset []
    environment:
      POSTGRES_DB: finguard
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard_test

  # The integration job starts only postgres + transaction-api.
  risk-worker:
    profiles: [ci-excluded]
    environment:
      AWS_PROFILE: !reset null
      AWS_REGION: ca-central-1
      AWS_DEFAULT_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
      SQS_QUEUE_URL: https://sqs.ca-central-1.amazonaws.com/000000000000/finguard-test
    volumes: !reset []

volumes: !reset {}
